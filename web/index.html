<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BriefGov — Meeting Summarizer</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
    background: #0f1117;
    color: #e6e6e6;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.subtitle { color: #9aa0a6; margin-top: 0; }
  textarea {
    width: 100%;
    height: 220px;
    padding: 12px;
    font-size: 0.95rem;
    background: #1a1d27;
    color: #e6e6e6;
    border: 1px solid #333;
    border-radius: 8px;
    box-sizing: border-box;
    resize: vertical;
  }
  button {
    margin-top: 12px;
    padding: 10px 22px;
    font-size: 0.95rem;
    background: #4f7cff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled { background: #555; cursor: not-allowed; }
  .result-box {
    margin-top: 24px;
    padding: 16px;
    background: #1a1d27;
    border: 1px solid #333;
    border-radius: 8px;
    min-height: 60px;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .label { font-size: 0.85rem; color: #9aa0a6; margin-bottom: 6px; }
  .status { font-size: 0.85rem; color: #9aa0a6; margin-top: 8px; }
</style>
</head>
<body>

<h1>BriefGov</h1>
<p class="subtitle">Meeting transcript summarizer — fine-tuned BART on MeetingBank</p>

<div class="label">Paste a meeting transcript</div>
<textarea id="transcript" placeholder="Paste transcript text here..."></textarea>
<br>
<button id="submitBtn" onclick="summarize()">Summarize</button>
<div class="status" id="status"></div>

<div class="label" style="margin-top:24px;">Summary</div>
<div class="result-box" id="result">Summary will appear here.</div>

<script>
const API_URL = "http://localhost:8000/summarize";

async function summarize() {
  const transcript = document.getElementById("transcript").value.trim();
  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if (!transcript) {
    status.textContent = "Please paste a transcript first.";
    return;
  }

  btn.disabled = true;
  status.textContent = "Summarizing... this may take a few seconds.";
  result.textContent = "";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ transcript })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "Request failed");
    }

    const data = await res.json();
    result.textContent = data.summary;
    status.textContent = "Done.";
  } catch (e) {
    status.textContent = "Error: " + e.message + " (is the FastAPI server running on port 8000?)";
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
